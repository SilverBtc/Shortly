services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tiktok-studio-backend
    ports:
      - "8000:8000"
    environment:
      - TIKTOK_DATABASE_URL=sqlite+aiosqlite:////data/app.db
      - TIKTOK_LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      - TIKTOK_LLM_API_KEY=${LLM_API_KEY:-}
      - TIKTOK_LLM_MODEL=${LLM_MODEL:-qwen2.5:7b}
      - TIKTOK_DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - TIKTOK_PUBLIC_BASE_URL=http://localhost:8000
      - TIKTOK_FRONTEND_DIR=/frontend
      - TIKTOK_REMOTION_BIN=/usr/local/bin/remotion-cli-wrapper
    volumes:
      - ./backend/data:/data
      # Sources frontend montées pour l'invocation locale de la CLI Remotion (rendu)
      - ./frontend:/frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tiktok-studio-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  # Redis est optionnel : le backend utilise asyncio.Queue par défaut.
  # Pour activer Redis+ARQ, décommentez et pointez TIKTOK_REDIS_URL sur ce service.
  # redis:
  #   image: redis:7-alpine
  #   container_name: tiktok-studio-redis
  #   ports:
  #     - "6379:6379"
  #   restart: unless-stopped
